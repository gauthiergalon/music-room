services:
  postgres:
    image: postgres:18
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file: .env
    # Every WebSocket, request and database connection is a file descriptor.
    # Docker's default of 1024 per process would cap the server at about a
    # thousand simultaneous users, whatever the machine.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # The backend applies the SQL migrations itself when it starts.
    depends_on:
      postgres:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  hifi-api:
    build: https://github.com/binimum/hifi-api.git#main
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - CLIENT_ID=${HIFI_API_CLIENT_ID}
      - CLIENT_SECRET=${HIFI_API_CLIENT_SECRET}
      - REFRESH_TOKEN=${HIFI_API_REFRESH_TOKEN}
      - USER_ID=${HIFI_API_USER_ID}
      - ACCESS_TOKEN=${HIFI_API_ACCESS_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
