services:
  postgres:
    image: postgres:18
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/migrations:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicroom"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: rust:latest
    working_dir: /app
    volumes:
      - ./backend:/app:Z
    command: cargo run
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  hifi-api:
    build: https://github.com/binimum/hifi-api.git#main
    env_file: .env
    ports:
      - "8000:8000"

volumes:
  postgres_data:
