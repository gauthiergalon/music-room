name: Server

on:
  push:
    branches: [main, dev]
    paths: ["server/**", ".github/workflows/server.yaml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yaml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Each test gets its own database created on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Compile against the query metadata committed in .sqlx: a query that
      # was changed without running `cargo sqlx prepare` fails the build.
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
