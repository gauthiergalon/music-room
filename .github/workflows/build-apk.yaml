name: Build APK

on:
  push:
    branches: [main, dev]
    paths: ["client/**", ".github/workflows/build-apk.yaml"]
  pull_request:
    paths: ["client/**", ".github/workflows/build-apk.yaml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Pinned to the version the app is developed and tested with. "Latest
      # stable" changes without notice and each release brings new lints:
      # raise this on purpose, together with the code changes it calls for.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Create the .env
        env:
          BACKEND_URL: https://music-room-z6n9.onrender.com
          GOOGLE_CLIENT_ID: 1068662764722-kfnc69v1mk1aq8gsb6e8h3kh1kl287qf.apps.googleusercontent.com
        run: |
          printf 'BACKEND_URL=%s\nGOOGLE_CLIENT_ID=%s\n' "$BACKEND_URL" "$GOOGLE_CLIENT_ID" > .env

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14