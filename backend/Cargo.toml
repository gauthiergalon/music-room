[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.0"
chrono = { version = "0.4.44", features = ["serde"] }
dotenv = "0.15.0"
futures-util = { version = "0.3.32", features = ["sink"] }
hex = "0.4.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
lettre = { version = "0.11.22", features = ["builder"] }
reqwest = { version = "0.13.3", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.10", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
validator = { version = "0.20.0" }
http = "1.4"
urlencoding = "2.1.3"
async-trait = "0.1.89"

[dev-dependencies]
axum-test = "20.0.0"
tokio = { version = "1.52.3", features = ["macros"] }
wiremock = "0.6.5"
